<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নতুন পাসওয়ার্ড সেট করুন — কাচাবাজার</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --green: #16a34a; --green-dark: #15803d; --gray-200: #e5e7eb; --gray-500: #6b7280; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
    body { background: linear-gradient(135deg, #f0fdf4, #ffffff); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; width: 100%; max-width: 400px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--gray-200); }
    .brand { text-align: center; font-size: 26px; font-weight: 700; color: var(--green-dark); margin-bottom: 20px; }
    .brand span { color: #ff6b35; }
    .form-group { margin-bottom: 15px; position: relative; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--gray-200); border-radius: 10px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: var(--green); }
    .btn { width: 100%; padding: 12px; background: var(--green); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:disabled { opacity: 0.7; }
    .alert { padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; text-align: center; display: none; }
    .alert-error { background: #fef2f2; color: #dc2626; }
    .alert-success { background: #f0fdf4; color: var(--green-dark); }
    .toggle-password { position: absolute; right: 14px; top: 38px; color: var(--gray-500); cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">কাচা<span>বাজার</span></div>
  <p style="text-align: center; font-size: 14px; margin-bottom: 20px;">আপনার নতুন পাসওয়ার্ড দিন</p>
  
  <div id="alertBox" class="alert"></div>

  <form id="updateForm">
    <div class="form-group">
      <label>নতুন পাসওয়ার্ড</label>
      <input type="password" id="newPassword" required placeholder="কমপক্ষে ৬ অক্ষর">
      <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('newPassword')"></i>
    </div>
    <button type="submit" class="btn" id="btnUpdate">পাসওয়ার্ড আপডেট করুন</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ddjtvleuntyjuasawoyj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_37VvUbK_5T79ddNbAgzykg_gDUVpKKV';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ✅ Supabase URL থেকে টোকেন রিড করে অটোমেটিক সেশন তৈরি করে
  supabase.auth.onAuthStateChange(async (event, session) => {
    if (event == "PASSWORD_RECOVERY") {
      console.log("Password recovery mode active");
    }
  });

  function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function showAlert(msg, type = 'error') {
    const box = document.getElementById('alertBox');
    box.textContent = msg;
    box.className = `alert alert-${type}`;
    box.style.display = 'block';
  }

  document.getElementById('updateForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnUpdate');
    const password = document.getElementById('newPassword').value;

    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> আপডেট হচ্ছে...';
    btn.disabled = true;

    try {
      const { data, error } = await supabase.auth.updateUser({ password: password });
      if (error) throw error;

      showAlert('পাসওয়ার্ড সফলভাবে আপডেট হয়েছে! লগইন পেজে যাচ্ছে...', 'success');
      setTimeout(() => {
        supabase.auth.signOut().then(() => {
          window.location.href = 'login.html'; // আপনার লগইন ফাইলের নাম
        });
      }, 2000);

    } catch (err) {
      showAlert(err.message);
      btn.innerHTML = 'পাসওয়ার্ড আপডেট করুন';
      btn.disabled = false;
    }
  };
</script>
<script src="js/pwa-init.js"></script>
</body>
</html>
