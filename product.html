<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পণ্য — কাচাবাজার</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .breadcrumb { font-size: 13px; color: var(--gray-500); padding: 16px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .breadcrumb a { color: var(--gray-700); }
    .breadcrumb a:hover { color: var(--green-600); }
    .breadcrumb .sep { color: var(--gray-300); }
    .product-view { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 24px 0 48px; }
    .product-view-img { border-radius: 16px; overflow: hidden; background: #fff; box-shadow: var(--shadow); position: relative; }
    .product-view-img img { width: 100%; height: 440px; object-fit: cover; }
    .product-view-info h1 { font-size: 30px; margin-bottom: 8px; line-height: 1.25; }
    .product-view-info .unit { color: var(--gray-500); margin-bottom: 14px; font-size: 14px; }
    .price-block { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .big-price { font-size: 34px; font-weight: 700; color: var(--green-700); }
    .big-old { text-decoration: line-through; color: var(--gray-500); font-size: 18px; }
    .origin-box { background: #f0fdf4; border-left: 4px solid #16a34a; padding: 14px 16px; border-radius: 8px; margin: 18px 0; }
    .origin-title { font-size: 13px; color: #15803d; font-weight: 600; margin-bottom: 6px; }
    .qty-row { display: flex; gap: 12px; align-items: center; margin: 20px 0; flex-wrap: wrap; }
    .qty-box { display: flex; border: 1px solid var(--gray-200); border-radius: 8px; overflow: hidden; background: #fff; }
    .qty-box button { width: 42px; height: 44px; font-size: 20px; color: var(--gray-700); }
    .qty-box button:hover { background: var(--gray-100); }
    .qty-box input { width: 56px; text-align: center; border: none; font-size: 16px; font-weight: 600; outline: none; font-family: inherit; }
    .desc { color: var(--gray-700); font-size: 15px; line-height: 1.8; margin-top: 20px; }
    .meta { margin-top: 20px; padding: 16px; background: var(--gray-50); border-radius: var(--radius); font-size: 14px; color: var(--gray-700); }
    .meta div { margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
    @media(max-width:900px) { .product-view { grid-template-columns: 1fr; gap: 20px; } .product-view-img img { height: 320px; } }
  </style>
</head>
<body>

<div id="site-header"></div>

<div class="container">
  <nav class="breadcrumb" id="breadcrumb">
    <a href="index.html">হোম</a> <span class="sep">›</span> <a href="shop.html">শপ</a>
  </nav>
  <div id="productContainer">
    <p style="padding:60px 0;text-align:center;color:var(--gray-500)">লোড হচ্ছে...</p>
  </div>
</div>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="section-head">
      <h2>সংশ্লিষ্ট পণ্য</h2>
      <a href="shop.html">সব দেখুন →</a>
    </div>
    <div class="product-grid" id="relatedGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/product.js"></script>
<script src="js/pwa-init.js"></script>
</body>
</html>
