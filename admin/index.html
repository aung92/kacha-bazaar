<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>লগইন — কাচাবাজার Admin</title>

  <!-- ✅ PWA -->
  <link rel="manifest" href="/admin/admin-manifest.json">
  <meta name="theme-color" content="#16a34a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="কাচাবাজার Admin">
  <link rel="apple-touch-icon" href="/admin/icons/admin-icon-192.png">

  <!-- ✅ Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ✅ Admin CSS -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">কাচা<span>বাজার</span></div>
    <p class="login-sub">Admin Panel — লগইন করুন</p>

    <form id="loginForm">
      <div class="field">
        <label>ইমেইল</label>
        <input type="email" id="email" required placeholder="admin@kachabazar.com" autocomplete="username">
      </div>
      <div class="field">
        <label>পাসওয়ার্ড</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i> লগইন
      </button>
    </form>

    <div class="hint" style="margin-top:20px;font-size:12px;line-height:1.8;">
      <strong style="color:#15803d;">
        <i class="fa-solid fa-shield-halved"></i> Supabase Auth দ্বারা সুরক্ষিত
      </strong><br>
      <small style="color:var(--gray-500)">
        admin@kachabazar.com দিয়ে লগইন করুন<br>
        (পাসওয়ার্ড Supabase Dashboard-এ সেট করা)
      </small>
    </div>

    <!-- ✅ PWA Install -->
    <div id="pwaInstallInfo" style="display:none;margin-top:16px;padding:12px;background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-radius:10px;border:1px solid #bbf7d0;text-align:center;">
      <div style="font-size:12px;color:#15803d;font-weight:600;margin-bottom:6px;">
        <i class="fa-solid fa-mobile-screen"></i> অ্যাডমিন অ্যাপ ইনস্টল করুন
      </div>
      <button type="button" id="pwaInstallBtn" style="background:#16a34a;color:#fff;border:none;padding:8px 18px;border-radius:8px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;">
        <i class="fa-solid fa-download"></i> ইনস্টল
      </button>
    </div>
  </div>
</div>

<!-- ============================================
     SCRIPT ORDER (Critical — বদলাবেন না!)
     ============================================ -->

<!-- ১. Config — সবসময় প্রথমে -->
<script src="js/config.js"></script>

<!-- ২. Supabase SDK (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ৩. Supabase client (config ব্যবহার করে) -->
<script src="js/supabase-client.js"></script>

<!-- ৪. Demo data + AdminStore -->
<script src="js/admin-data.js"></script>

<!-- ৫. Utils -->
<script src="js/utils.js"></script>

<!-- ৬. Auth -->
<script src="js/admin-auth.js"></script>

<!-- ৭. Page handler -->
<script>
  // ============================================
  // Auto-redirect if already logged in
  // ============================================
  if (typeof getAdmin === 'function' && getAdmin()) {
    location.href = 'dashboard.html';
  }

  // ============================================
  // Login Form Handler
  // ============================================
  document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');

    if (!email || !password) {
      showToast('ইমেইল ও পাসওয়ার্ড দিন', 'error');
      return;
    }

    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> লগইন হচ্ছে...';
    btn.disabled = true;

    try {
      const res = await adminLogin(email, password);

      if (res.ok) {
        showToast('লগইন সফল ✅', 'success');
        setTimeout(() => location.href = 'dashboard.html', 500);
      } else {
        showToast(res.message || 'লগইন ব্যর্থ', 'error');
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> লগইন';
        btn.disabled = false;
      }
    } catch (err) {
      console.error('Login error:', err);
      showToast('সমস্যা: ' + (err.message || 'Unknown error'), 'error');
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> লগইন';
      btn.disabled = false;
    }
  };

  // ============================================
  // PWA Install Prompt
  // ============================================
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const info = document.getElementById('pwaInstallInfo');
    if (info && !window.matchMedia('(display-mode: standalone)').matches) {
      info.style.display = 'block';
    }
  });

  document.getElementById('pwaInstallBtn')?.addEventListener('click', async () => {
    if (!deferredPrompt) {
      showToast('ইনস্টল প্রম্পট পাওয়া যায়নি', 'error');
      return;
    }
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    if (choice.outcome === 'accepted') {
      showToast('অ্যাপ ইনস্টল হচ্ছে...', 'success');
    }
    deferredPrompt = null;
    document.getElementById('pwaInstallInfo').style.display = 'none';
  });

  // ============================================
  // Service Worker Register
  // ============================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('/admin/admin-sw.js', { scope: '/admin/' })
        .then(reg => console.log('✅ SW registered:', reg.scope))
        .catch(err => console.warn('SW registration failed:', err));
    });
  }

  // ============================================
  // Debug — config state
  // ============================================
  window.addEventListener('load', () => {
    const cfg = window.APP_CONFIG || {};
    console.log('📋 Config status:', {
      configLoaded: !!cfg.SUPABASE_URL,
      source: cfg.SUPABASE_URL ? 'config.js' : 'fallback',
      supabaseReady: !!window.__supabaseClient
    });
  });
</script>
</body>
</html>
