<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অফলাইন — কাচাবাজার Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
      color: #fff;
    }
    .offline-box {
      text-align: center;
      max-width: 400px;
      background: #1f2937;
      padding: 40px 28px;
      border-radius: 20px;
      border: 1px solid #374151;
    }
    .icon {
      width: 100px;
      height: 100px;
      background: rgba(239,68,68,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 44px;
      color: #ef4444;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #9ca3af; font-size: 15px; margin-bottom: 24px; line-height: 1.6; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #16a34a;
      color: #fff;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
    }
    .btn:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="offline-box">
    <div class="icon"><i class="fa-solid fa-wifi"></i></div>
    <h1>অফলাইন মোড</h1>
    <p>ইন্টারনেট সংযোগ নেই। ড্যাশবোর্ড দেখতে সংযোগ প্রয়োজন।</p>
    <a href="/admin/dashboard.html" class="btn">
      <i class="fa-solid fa-rotate-right"></i> আবার চেষ্টা করুন
    </a>
  </div>
  <script>
    setInterval(() => { if (navigator.onLine) location.href = '/admin/dashboard.html'; }, 3000);
  </script>
</body>
</html>
