<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পেমেন্ট সফল — কাচাবাজার</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/variables.css">
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: var(--gray-50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .success-card {
      background: #fff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    .icon-box {
      width: 80px; height: 80px;
      background: #dcfce7;
      color: #16a34a;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 24px; color: var(--gray-900); margin-bottom: 8px; }
    p { color: var(--gray-500); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: inline-block;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--green-600); color: #fff; }
    .btn-primary:hover { background: var(--green-700); }
    .btn-outline { background: #fff; color: var(--gray-700); border: 1px solid var(--gray-300); }
    .btn-outline:hover { background: var(--gray-50); }
  </style>
</head>
<body>

<div class="success-card">
  <div class="icon-box">
    <i class="fa-solid fa-check"></i>
  </div>
  <h1>পেমেন্ট সফল হয়েছে!</h1>
  <p>আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে। আমাদের ডেলিভারি টিম শীঘ্রই আপনার সাথে যোগাযোগ করবে।</p>
  
  <div class="btn-group">
    <a href="/account.html" class="btn btn-primary">আমার অর্ডার দেখুন</a>
    <a href="/shop.html" class="btn btn-outline">আরও কেনাকাটা করুন</a>
  </div>
</div>

</body>
</html>
