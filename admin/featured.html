<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ফিচার্ড পণ্য — কাচাবাজার Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .featured-item { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--gray-200); }
    .featured-item:last-child { border-bottom:none; }
    .featured-item img { width:48px; height:48px; border-radius:8px; object-fit:cover; }
    .featured-item .drag-handle { cursor:grab; color:var(--gray-400); font-size:18px; }
    .featured-item .info { flex:1; }
    .featured-item h4 { font-size:14px; margin-bottom:2px; }
    .featured-item small { color:var(--gray-500); font-size:12px; }
    .featured-item.dragging { opacity:0.4; }
    .featured-item.drag-over { border-top:2px solid var(--green-500); }
  </style>
</head>
<body data-title="ফিচার্ড পণ্য">

<div class="admin-wrap">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="page-head">
        <h1>⭐ ফিচার্ড / জনপ্রিয় পণ্য</h1>
        <p style="font-size:13px;color:var(--gray-500); margin:0;">হোমপেজের "জনপ্রিয় পণ্য" সেকশনে এই পণ্যগুলো দেখাবে। ড্র্যাগ করে সাজান।</p>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>সিলেক্টেড পণ্য (<span id="featuredCount">0</span>)</h2>
          <button class="btn btn-sm btn-outline" onclick="clearFeatured()"><i class="fa-solid fa-trash"></i> সব রিমুভ</button>
        </div>
        <div id="featuredList"></div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card-head"><h2>📦 সব পণ্য থেকে যোগ করুন</h2></div>
        <div class="card-body">
          <div class="filter-bar">
            <input type="text" id="searchProduct" placeholder="🔍 পণ্য খুঁজুন...">
            <select id="filterCat"><option value="">সব ক্যাটাগরি</option></select>
          </div>
          <div id="allProductsList" style="max-height:400px; overflow-y:auto;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/admin-data.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-layout.js"></script>
<script>
  requireAdmin();

  const CAT_LABELS = { veg:'সবজি', fruit:'ফলমূল', fish:'মাছ', meat:'মাংস', dairy:'দুধ ও ডিম', spice:'মসলা', honey:'মধু', rice:'চাল ও ডাল', organic:'অর্গানিক' };

  function getProducts() { return AdminStore.get('products', DEMO_PRODUCTS); }
  function getFeatured() { return AdminStore.get('featured_products', [1, 4, 14, 6, 9, 21, 2, 10]); }
  function saveFeatured(arr) { AdminStore.set('featured_products', arr); }

  // সরাসরি আপডেট হলে frontend-এ ব্যবহার হবে
  function syncToFrontend() {
    AdminStore.set('featured_products', getFeatured());
  }

  let dragSrc = null;

  function renderFeatured() {
    const products = getProducts();
    const ids = getFeatured();
    const featured = ids.map(id => products.find(p => p.id === id)).filter(Boolean);

    document.getElementById('featuredCount').textContent = featured.length;
    const el = document.getElementById('featuredList');
    if (!featured.length) {
      el.innerHTML = '<div class="empty-state"><i class="fa-solid fa-star"></i><p>কোনো ফিচার্ড পণ্য নেই</p></div>';
      return;
    }

    el.innerHTML = featured.map((p, i) => `
      <div class="featured-item" draggable="true" data-id="${p.id}" data-idx="${i}">
        <i class="fa-solid fa-grip-vertical drag-handle"></i>
        <span style="font-weight:700;color:var(--gray-500);width:24px;">${i+1}.</span>
        <img src="${p.img}" alt="${p.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22><rect width=%2248%22 height=%2248%22 fill=%22%23e5e7eb%22/></svg>'">
        <div class="info">
          <h4>${p.name}</h4>
          <small>${CAT_LABELS[p.category] || p.category} · ${formatTk(p.price)}</small>
        </div>
        <button class="btn btn-sm btn-danger" onclick="removeFeatured(${p.id})"><i class="fa-solid fa-xmark"></i></button>
      </div>
    `).join('');

    // Drag & Drop
    el.querySelectorAll('.featured-item').forEach(item => {
      item.addEventListener('dragstart', (e) => {
        dragSrc = item;
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        el.querySelectorAll('.featured-item').forEach(i => i.classList.remove('drag-over'));
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (item !== dragSrc) item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
      item.addEventListener('drop', (e) => {
        e.preventDefault();
        item.classList.remove('drag-over');
        if (!dragSrc || item === dragSrc) return;
        const ids = getFeatured();
        const srcIdx = +dragSrc.dataset.idx;
        const dstIdx = +item.dataset.idx;
        const [moved] = ids.splice(srcIdx, 1);
        ids.splice(dstIdx, 0, moved);
        saveFeatured(ids);
        renderFeatured();
      });
    });
  }

  function renderAllProducts() {
    const products = getProducts();
    const featuredIds = getFeatured();
    const search = (document.getElementById('searchProduct').value || '').toLowerCase();
    const cat = document.getElementById('filterCat').value;

    let list = products.filter(p => !featuredIds.includes(p.id));
    if (search) list = list.filter(p => p.name.toLowerCase().includes(search));
    if (cat) list = list.filter(p => p.category === cat);

    const el = document.getElementById('allProductsList');
    if (!list.length) {
      el.innerHTML = '<p style="text-align:center;color:var(--gray-500);padding:20px;">সব পণ্য ইতিমধ্যে যোগ করা আছে</p>';
      return;
    }

    el.innerHTML = list.map(p => `
      <div class="featured-item">
        <img src="${p.img}" alt="${p.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22><rect width=%2248%22 height=%2248%22 fill=%22%23e5e7eb%22/></svg>'">
        <div class="info">
          <h4>${p.name}</h4>
          <small>${CAT_LABELS[p.category] || p.category} · ${formatTk(p.price)}</small>
        </div>
        <button class="btn btn-sm btn-primary" onclick="addFeatured(${p.id})"><i class="fa-solid fa-plus"></i> যোগ</button>
      </div>
    `).join('');
  }

  function addFeatured(id) {
    const ids = getFeatured();
    if (!ids.includes(id)) ids.push(id);
    saveFeatured(ids);
    renderFeatured();
    renderAllProducts();
    showToast('ফিচার্ডে যোগ ✅', 'success');
  }

  function removeFeatured(id) {
    saveFeatured(getFeatured().filter(x => x !== id));
    renderFeatured();
    renderAllProducts();
    showToast('সরানো হয়েছে', 'error');
  }

  function clearFeatured() {
    if (!confirm('সব ফিচার্ড পণ্য রিমুভ?')) return;
    saveFeatured([]);
    renderFeatured();
    renderAllProducts();
  }

  document.addEventListener('DOMContentLoaded', () => {
    const catSel = document.getElementById('filterCat');
    Object.entries(CAT_LABELS).forEach(([k, v]) => catSel.insertAdjacentHTML('beforeend', `<option value="${k}">${v}</option>`));
    
    document.getElementById('searchProduct').addEventListener('input', renderAllProducts);
    catSel.addEventListener('change', renderAllProducts);

    renderFeatured();
    renderAllProducts();
  });
</script>
</body>
</html>
