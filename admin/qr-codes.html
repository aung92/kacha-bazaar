<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR কোড — কাচাবাজার Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
          onerror="window.__qrCdnFailed = true; console.warn('QRCode CDN failed');"></script>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .qr-card {
      background: #fff;
      border: 2px dashed var(--gray-300);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .qr-card h4 {
      font-size: 13px;
      margin: 8px 0 4px;
    }
    .qr-card small {
      font-size: 11px;
      color: var(--gray-500);
    }
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }
    .qr-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100px;
      height: 100px;
      margin: 0 auto;
      background: var(--gray-100);
      border-radius: 6px;
      color: var(--gray-500);
      font-size: 11px;
      text-align: center;
      padding: 6px;
      line-height: 1.3;
    }
    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: absolute; left: 0; top: 0; width: 100%; }
      .admin-wrap, .topbar, .sidebar, .page-head, .no-print { display: none !important; }
    }
  </style>
</head>
<body data-title="QR কোড">

<div class="admin-wrap">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="page-head no-print">
        <h1>📱 পণ্য QR কোড</h1>
        <button class="btn btn-primary" onclick="window.print()">
          <i class="fa-solid fa-print"></i> প্রিন্ট
        </button>
      </div>

      <div class="card no-print">
        <div class="card-body">
          <p style="font-size:13px; color:var(--gray-600);">
            <i class="fa-solid fa-info-circle" style="color:var(--green-600)"></i>
            প্রতিটি QR স্ক্যান করলে পণ্যের পেজ খুলবে। প্রিন্ট করে পণ্যের গায়ে লাগাতে পারেন।
          </p>
        </div>
      </div>

      <div class="print-area">
        <div class="qr-grid" id="qrGrid"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/admin-data.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-layout.js"></script>
<script>
  requireAdmin();

  function getProducts() {
    return AdminStore.get('products', DEMO_PRODUCTS);
  }

  function render() {
    const grid = document.getElementById('qrGrid');
    const products = getProducts().slice(0, 12);

    if (!products.length) {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--gray-500);padding:40px;">কোনো পণ্য নেই</p>';
      return;
    }

    // ✅ প্রথমে সব HTML তৈরি করি
    grid.innerHTML = products.map(p => `
      <div class="qr-card">
        <div id="qr-${p.id}" style="display:flex; justify-content:center; align-items:center; min-height:100px;">
          <div class="qr-placeholder">QR লোড হচ্ছে...</div>
        </div>
        <h4>${p.name}</h4>
        <small>${formatTk(p.price)} · ${p.unit}</small>
      </div>
    `).join('');

    // ✅ তারপর QR render
    const qrAvailable = typeof QRCode !== 'undefined' && !window.__qrCdnFailed;

    products.forEach(p => {
      const el = document.getElementById('qr-' + p.id);
      if (!el) return;

      if (!qrAvailable) {
        el.innerHTML = '<div class="qr-placeholder">QR লাইব্রেরি লোড হয়নি</div>';
        return;
      }

      try {
        el.innerHTML = '';
        const url = window.location.origin + '/product.html?id=' + p.id;
        new QRCode(el, {
          text: url,
          width: 100,
          height: 100,
          colorDark: '#111827',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch (e) {
        console.error('QR generation failed for', p.id, e);
        el.innerHTML = '<div class="qr-placeholder">QR তৈরি ব্যর্থ</div>';
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    // CDN fail হলে যদি স্ক্রিপ্ট লোড না হয়ে থাকে, তবুও ১ সেকেন্ড পর চেক
    if (!window.__qrCdnFailed && typeof QRCode === 'undefined') {
      // সম্ভবত এখনো লোড হচ্ছে
      setTimeout(render, 500);
    } else {
      render();
    }
  });
</script>
</body>
</html>
