<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লেবেল প্রিন্ট — কাচাবাজার Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .label-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; margin-top:16px; }
    .product-label { border:2px dashed var(--gray-300); border-radius:8px; padding:14px; background:#fff; text-align:center; }
    .product-label h4 { font-size:14px; margin-bottom:4px; }
    .product-label small { font-size:11px; color:var(--gray-500); display:block; margin-bottom:6px; }
    .product-label .price { font-weight:700; color:var(--green-700); font-size:15px; }
    .product-label .qr { font-size:40px; color:var(--gray-300); margin:6px 0; }
    @media print {
      body * { visibility:hidden; }
      .print-area, .print-area * { visibility:visible; }
      .print-area { position:absolute; left:0; top:0; width:100%; }
      .admin-wrap, .topbar, .sidebar, .page-head, .no-print { display:none !important; }
      .label-grid { grid-template-columns:repeat(3, 1fr); }
      .product-label { page-break-inside:avoid; }
    }
  </style>
</head>
<body data-title="লেবেল প্রিন্ট">

<div class="admin-wrap">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="page-head no-print">
        <h1>🖨️ লেবেল / স্টিকার প্রিন্ট</h1>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" onclick="selectAll()">সব সিলেক্ট</button>
          <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> প্রিন্ট</button>
        </div>
      </div>

      <div class="card no-print">
        <div class="card-body">
          <p style="font-size:13px; color:var(--gray-600);">
            <i class="fa-solid fa-info-circle" style="color:var(--green-600)"></i>
            পণ্য সিলেক্ট করুন → প্রিন্ট → স্টিকার প্রিন্ট হবে (৩ কলাম)
          </p>
        </div>
      </div>

      <div class="print-area">
        <div class="label-grid" id="labelGrid"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/admin-data.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-layout.js"></script>
<script>
  requireAdmin();
  function getProducts() { return AdminStore.get('products', DEMO_PRODUCTS); }
  let selected = new Set();

  function render() {
    const products = getProducts();
    document.getElementById('labelGrid').innerHTML = products.map(p => {
      const isSel = selected.has(p.id);
      return `
        <div class="product-label" style="${isSel ? 'border-color:var(--green-600); background:#f0fdf4;' : ''}">
          <label class="no-print" style="display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:8px; cursor:pointer; font-size:12px;">
            <input type="checkbox" ${isSel ? 'checked' : ''} onchange="toggleSelect(${p.id}, this.checked)" style="width:auto; accent-color:var(--green-600);">
            সিলেক্ট
          </label>
          <h4>${p.name}</h4>
          <small>কাচাবাজার · ${p.unit}</small>
          <div class="qr"><i class="fa-solid fa-qrcode"></i></div>
          <div class="price">${formatTk(p.price)}</div>
          <small style="margin-top:6px; font-size:9px;">www.kachabazar.com</small>
        </div>
      `;
    }).join('');
  }

  function toggleSelect(id, checked) {
    if (checked) selected.add(id); else selected.delete(id);
    render();
  }

  function selectAll() {
    if (selected.size === getProducts().length) selected.clear();
    else getProducts().forEach(p => selected.add(p.id));
    render();
  }

  render();
</script>
</body>
</html>
