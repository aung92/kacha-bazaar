<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ভিডিও শোকেস — কাচাবাজার Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-title="ভিডিও শোকেস">

<div class="admin-wrap">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="page-head">
        <h1>🎬 ভিডিও শোকেস</h1>
        <button class="btn btn-primary" onclick="openVideoModal()"><i class="fa-solid fa-plus"></i> নতুন ভিডিও</button>
      </div>

      <div class="card">
        <div class="card-body no-pad">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>ভিডিও</th><th>টাইটেল</th><th>পণ্য</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead>
              <tbody id="videoBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="videoModal">
  <div class="modal" style="max-width:520px">
    <div class="modal-head"><h3 id="modalTitle">নতুন ভিডিও</h3><button class="close-modal" onclick="closeModal('videoModal')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="videoId">
      <div class="form-row single"><div class="form-group"><label>টাইটেল <span class="req">*</span></label><input type="text" id="videoTitle" placeholder="যেমন: পাহাড়ি মধু সংগ্রহ"></div></div>
      <div class="form-row single"><div class="form-group"><label>ভিডিও URL <span class="req">*</span></label><input type="url" id="videoUrl" placeholder="YouTube বা MP4 URL"></div></div>
      <div class="form-row single"><div class="form-group"><label>থাম্বনেইল URL</label><input type="url" id="videoThumb" placeholder="https://..."></div></div>
      <div class="form-row single"><div class="form-group"><label>সংযুক্ত পণ্য (ঐচ্ছিক)</label><input type="text" id="videoProduct" placeholder="পণ্যের নাম"></div></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="videoActive" checked style="width:auto;accent-color:var(--green-600)"><span>প্রকাশিত</span></label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal('videoModal')">বাতিল</button>
      <button class="btn btn-primary" onclick="saveVideo()">সেভ</button>
    </div>
  </div>
</div>

<script src="js/admin-data.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-layout.js"></script>
<script>
  requireAdmin();
  const DEFAULT_VIDEOS = [
    { id: 1, title: 'পাহাড়ি মধু সংগ্রহ', url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', thumb: '', product: 'পাহাড়ি মধু', active: true }
  ];

  function getVideos() { return AdminStore.get('videos', DEFAULT_VIDEOS); }
  function saveVideos(l) { AdminStore.set('videos', l); }

  function render() {
    document.getElementById('videoBody').innerHTML = getVideos().map(v => `
      <tr>
        <td>
          ${v.thumb ? `<img src="${v.thumb}" style="width:60px; height:40px; object-fit:cover; border-radius:6px;" onerror="this.style.display='none';">` : '<i class="fa-solid fa-video" style="font-size:24px; color:var(--gray-400)"></i>'}
        </td>
        <td><strong>${v.title}</strong></td>
        <td>${v.product || '—'}</td>
        <td><span class="badge ${v.active ? 'badge-active' : 'badge-inactive'}">${v.active ? 'প্রকাশিত' : 'ড্রাফট'}</span></td>
        <td class="actions">
          <button onclick="editVideo(${v.id})"><i class="fa-solid fa-pen"></i></button>
          <button class="del" onclick="deleteVideo(${v.id})"><i class="fa-solid fa-trash"></i></button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--gray-500)">কোনো ভিডিও নেই</td></tr>';
  }

  function openVideoModal() {
    document.getElementById('videoId').value = '';
    ['videoTitle','videoUrl','videoThumb','videoProduct'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('videoActive').checked = true;
    document.getElementById('modalTitle').textContent = 'নতুন ভিডিও';
    document.getElementById('videoModal').classList.add('show');
  }

  function editVideo(id) {
    const v = getVideos().find(x => x.id === id);
    if (!v) return;
    document.getElementById('videoId').value = v.id;
    document.getElementById('videoTitle').value = v.title;
    document.getElementById('videoUrl').value = v.url;
    document.getElementById('videoThumb').value = v.thumb || '';
    document.getElementById('videoProduct').value = v.product || '';
    document.getElementById('videoActive').checked = v.active;
    document.getElementById('modalTitle').textContent = 'এডিট ভিডিও';
    document.getElementById('videoModal').classList.add('show');
  }

  function saveVideo() {
    const id = document.getElementById('videoId').value;
    const title = document.getElementById('videoTitle').value.trim();
    const url = document.getElementById('videoUrl').value.trim();
    if (!title || !url) { showToast('টাইটেল ও URL দিন', 'error'); return; }
    const data = {
      title, url,
      thumb: document.getElementById('videoThumb').value.trim(),
      product: document.getElementById('videoProduct').value.trim(),
      active: document.getElementById('videoActive').checked
    };
    const list = getVideos();
    if (id) {
      const idx = list.findIndex(x => x.id === +id);
      list[idx] = { ...list[idx], ...data };
    } else {
      list.push({ id: Date.now(), ...data });
    }
    saveVideos(list);
    closeModal('videoModal');
    render();
    showToast('সেভ ✅', 'success');
  }

  function deleteVideo(id) {
    if (!confirm('ডিলিট?')) return;
    saveVideos(getVideos().filter(v => v.id !== id));
    render();
    showToast('ডিলিট ✅', 'success');
  }

  function closeModal(id) { document.getElementById(id).classList.remove('show'); }
  render();
</script>
</body>
</html>
