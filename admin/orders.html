<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অর্ডার — কাচাবাজার Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  
  <style>
    .manual-item-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 40px;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    
    .od-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed var(--gray-200);
      font-size: 14px;
    }
    .od-item:last-child { border-bottom: none; }
    .od-section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 20px 0 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--gray-200);
    }

    /* 🖨️ PROFESSIONAL INVOICE DESIGN (Hidden on Screen) */
    #invoicePrintArea { display: none; }

    @media print {
      body * { visibility: hidden; }
      #invoicePrintArea, #invoicePrintArea * { visibility: visible; }
      #invoicePrintArea {
        display: block !important;
        position: absolute; left: 0; top: 0; width: 100%;
        background: #fff; padding: 0; margin: 0;
        font-family: 'Hind Siliguri', sans-serif; color: #1a1a1a;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      .admin-wrap, .sidebar, .topbar, .mobile-bottom-nav, .sidebar-overlay,
      .no-print, #backTopBtn, .page-head, .admin-content > .card,
      #adminSidebar, #adminTopbar, .modal-overlay, .custom-confirm-modal { display: none !important; }

      @page { size: A4; margin: 15mm; }
      html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; }

      /* ইনভয়েস স্টাইল */
      .inv-container { width: 100%; max-width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
      .inv-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 30px; border-bottom: 2px solid #16a34a; background: #f9fafb; }
      .inv-brand { display: flex; gap: 16px; align-items: center; }
      .inv-logo-box { width: 60px; height: 60px; background: #16a34a; color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; }
      .inv-brand-text h1 { font-size: 28px; font-weight: 700; color: #111827; margin: 0; line-height: 1.2; }
      .inv-brand-text h1 span { color: #ea580c; }
      .inv-brand-text p { font-size: 12px; color: #6b7280; margin: 2px 0 0; }
      .inv-meta { text-align: right; }
      .inv-title { font-size: 32px; font-weight: 800; color: #16a34a; margin-bottom: 8px; letter-spacing: 2px; }
      .inv-meta-box { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; font-size: 12px; text-align: left; min-width: 220px; }
      .inv-meta-box div { display: flex; justify-content: space-between; margin-bottom: 6px; }
      .inv-meta-box div:last-child { margin-bottom: 0; }
      .inv-meta-box span:first-child { color: #6b7280; }
      .inv-meta-box span:last-child { font-weight: 600; color: #111827; }

      .inv-parties { display: grid; grid-template-columns: 1fr 1fr; padding: 30px; gap: 30px; border-bottom: 1px solid #e5e7eb; }
      .inv-party h4 { font-size: 11px; font-weight: 700; color: #16a34a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 2px solid #16a34a; padding-bottom: 4px; display: inline-block; }
      .inv-party p { font-size: 13px; color: #374151; line-height: 1.6; margin-bottom: 4px; }
      .inv-party p strong { color: #111827; }

      .inv-table-wrap { padding: 0 30px; }
      .inv-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
      .inv-table th { background: #16a34a; color: #fff; font-size: 12px; font-weight: 600; padding: 12px; text-align: left; text-transform: uppercase; letter-spacing: 0.5px; }
      .inv-table th.right { text-align: right; }
      .inv-table th.center { text-align: center; }
      .inv-table td { padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 13px; color: #111827; }
      .inv-table td.right { text-align: right; font-weight: 600; }
      .inv-table td.center { text-align: center; }
      .inv-table tr:nth-child(even) { background: #f9fafb; }

      .inv-summary-wrap { display: flex; justify-content: space-between; padding: 20px 30px 30px; }
      .inv-summary-left { flex: 1; }
      .inv-summary-left .amount-words { background: #f0fdf4; border-left: 4px solid #16a34a; padding: 12px 16px; border-radius: 6px; font-size: 12px; color: #15803d; margin-bottom: 20px; }
      .inv-summary-left .amount-words strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; color: #16a34a; }

      .inv-summary-right { width: 280px; }
      .inv-summary-right .summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; color: #4b5563; border-bottom: 1px dashed #e5e7eb; }
      .inv-summary-right .summary-row:last-child { border-bottom: none; }
      .inv-summary-right .summary-row span:last-child { font-weight: 600; color: #111827; }
      .inv-summary-right .summary-row.grand { border-top: 2px solid #16a34a; border-bottom: none; margin-top: 8px; padding-top: 12px; font-size: 18px; font-weight: 800; }
      .inv-summary-right .summary-row.grand span:first-child { color: #16a34a; }
      .inv-summary-right .summary-row.grand span:last-child { color: #15803d; }

      .inv-footer { background: #f9fafb; border-top: 1px solid #e5e7eb; padding: 20px 30px; text-align: center; }
      .inv-footer .thanks { font-size: 15px; font-weight: 700; color: #16a34a; margin-bottom: 6px; }
      .inv-footer .policy { font-size: 11px; color: #6b7280; margin-bottom: 10px; }
      .inv-footer .contact-info { display: flex; justify-content: center; gap: 20px; font-size: 11px; color: #4b5563; margin-bottom: 10px; }
      .inv-footer .contact-info span { display: flex; align-items: center; gap: 4px; }
      .inv-footer .copyright { font-size: 10px; color: #9ca3af; border-top: 1px dashed #d1d5db; padding-top: 10px; }
    }
  </style>
</head>
<body data-title="অর্ডার">

<div class="admin-wrap">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>

    <div class="admin-content">
      <div class="page-head">
        <h1>🛒 অর্ডার</h1>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <!-- ✅ নতুন: সব স্লিপ একসাথে প্রিন্ট করার বাটন -->
          <button class="btn btn-outline" onclick="printAllSlips()" style="border-color: var(--green-600); color: var(--green-700);">
            <i class="fa-solid fa-print"></i> সব স্লিপ প্রিন্ট
          </button>
          <button class="btn btn-outline" onclick="exportOrdersCSV()">
            <i class="fa-solid fa-download"></i> CSV
          </button>
          <button class="btn btn-primary" onclick="openManualOrderModal()">
            <i class="fa-solid fa-plus"></i> ম্যানুয়াল অর্ডার
          </button>
        </div>
      </div>

      <!-- Status tabs -->
      <div class="card" style="margin-bottom:16px">
        <div class="card-body" style="display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px">
          <button class="btn btn-sm btn-primary status-tab active" data-status="all">সব (<span id="countAll">0</span>)</button>
          <button class="btn btn-sm btn-outline status-tab" data-status="pending">অপেক্ষমাণ (<span id="countPending">0</span>)</button>
          <button class="btn btn-sm btn-outline status-tab" data-status="confirmed">কনফার্ম (<span id="countConfirmed">0</span>)</button>
          <button class="btn btn-sm btn-outline status-tab" data-status="packed">প্যাকড (<span id="countPacked">0</span>)</button>
          <button class="btn btn-sm btn-outline status-tab" data-status="shipped">শিপড (<span id="countShipped">0</span>)</button>
          <button class="btn btn-sm btn-outline status-tab" data-status="delivered">ডেলিভার্ড (<span id="countDelivered">0</span>)</button>
          <button class="btn btn-sm btn-outline status-tab" data-status="cancelled">বাতিল (<span id="countCancelled">0</span>)</button>
        </div>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 অর্ডার ID, কাস্টমার নাম বা ফোন দিয়ে খুঁজুন...">
        <select id="filterPayment">
          <option value="">সব পেমেন্ট</option>
          <option value="cod">ক্যাশ অন ডেলিভারি</option>
          <option value="bkash">বিকাশ</option>
          <option value="nagad">নগদ</option>
          <option value="card">কার্ড</option>
          <option value="aamarpay">aamarPay</option>
        </select>
        <select id="sortBy">
          <option value="newest">নতুন আগে</option>
          <option value="oldest">পুরনো আগে</option>
          <option value="amount-high">দাম বেশি → কম</option>
          <option value="amount-low">দাম কম → বেশি</option>
        </select>
      </div>

      <div class="card">
        <div class="card-body no-pad">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>অর্ডার ID</th>
                  <th>কাস্টমার</th>
                  <th>তারিখ</th>
                  <th>আইটেম</th>
                  <th>মোট</th>
                  <th>পেমেন্ট</th>
                  <th>স্ট্যাটাস</th>
                  <th>অ্যাকশন</th>
                </tr>
              </thead>
              <tbody id="ordersBody">
                <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--gray-500)">লোড হচ্ছে...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ✅ Order Detail Modal -->
<div class="modal-overlay" id="orderDetailModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-head">
      <h3 id="odTitle">অর্ডার বিস্তারিত</h3>
      <button class="close-modal" onclick="closeModal('orderDetailModal')">×</button>
    </div>
    <div class="modal-body" id="orderDetailContent"></div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal('orderDetailModal')">বন্ধ করুন</button>
      <button class="btn btn-primary" onclick="printFromModal()" id="modalPrintBtn">
        <i class="fa-solid fa-print"></i> প্রিন্ট করুন
      </button>
    </div>
  </div>
</div>

<!-- ✅ লুকানো প্রিন্ট এরিয়া -->
<div id="invoicePrintArea"></div>

<!-- ✅ স্ক্রিপ্ট সিরিয়াল -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-layout.js"></script>
<script src="js/admin-orders.js"></script>
</body>
</html>
