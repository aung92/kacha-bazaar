<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রিটার্ন / রিফান্ড — কাচাবাজার Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-title="রিটার্ন / রিফান্ড">

<div class="admin-wrap">
  <div id="admin-sidebar"></div>
  <div class="admin-main">
    <div id="admin-topbar"></div>
    <div class="admin-content">
      <div class="page-head">
        <h1>↩️ রিটার্ন / রিফান্ড</h1>
        <button class="btn btn-primary" onclick="openReturnModal()"><i class="fa-solid fa-plus"></i> নতুন রিটার্ন</button>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 অর্ডার ID বা কাস্টমার...">
        <select id="filterStatus">
          <option value="">সব স্ট্যাটাস</option>
          <option value="pending">অপেক্ষমাণ</option>
          <option value="approved">অনুমোদিত</option>
          <option value="rejected">প্রত্যাখ্যাত</option>
          <option value="refunded">রিফান্ডেড</option>
        </select>
      </div>

      <div class="card">
        <div class="card-body no-pad">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>রিটার্ন ID</th>
                  <th>অর্ডার</th>
                  <th>কাস্টমার</th>
                  <th>কারণ</th>
                  <th>রিফান্ড</th>
                  <th>তারিখ</th>
                  <th>স্ট্যাটাস</th>
                  <th>অ্যাকশন</th>
                </tr>
              </thead>
              <tbody id="returnBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="returnModal">
  <div class="modal" style="max-width:520px">
    <div class="modal-head">
      <h3 id="modalTitle">নতুন রিটার্ন</h3>
      <button class="close-modal" onclick="closeModal('returnModal')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="returnId">
      <div class="form-row single">
        <div class="form-group"><label>অর্ডার ID <span class="req">*</span></label><input type="text" id="returnOrderId" placeholder="KC100001"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>কাস্টমার <span class="req">*</span></label><input type="text" id="returnCustomer" placeholder="নাম"></div>
        <div class="form-group"><label>ফোন</label><input type="tel" id="returnPhone" placeholder="01XXXXXXXXX"></div>
      </div>
      <div class="form-row single">
        <div class="form-group"><label>কারণ <span class="req">*</span></label>
          <select id="returnReason">
            <option>ড্যামেজ / ভাঙা</option>
            <option>ভুল পণ্য পাঠানো হয়েছে</option>
            <option>পণ্য পছন্দ হয়নি</option>
            <option>ডেলিভারি দেরি</option>
            <option>অন্যান্য</option>
          </select>
        </div>
      </div>
      <div class="form-row single">
        <div class="form-group"><label>রিফান্ড পরিমাণ (৳)</label><input type="number" id="returnAmount" min="0" placeholder="0"></div>
      </div>
      <div class="form-row single">
        <div class="form-group"><label>নোট</label><textarea id="returnNote" rows="2"></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal('returnModal')">বাতিল</button>
      <button class="btn btn-primary" onclick="saveReturn()">সেভ</button>
    </div>
  </div>
</div>

<script src="js/admin-data.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-layout.js"></script>
<script>
  requireAdmin();
  const DEFAULT_RETURNS = [
    { id: 'RT1001', orderId: 'KC100001', customer: 'রফিক আহমেদ', phone: '01711111111', reason: 'ড্যামেজ / ভাঙা', amount: 850, date: '2025-01-21', status: 'pending', note: 'মধুর বোতল ভাঙা' },
    { id: 'RT1002', orderId: 'KC100002', customer: 'সাদিয়া ইসলাম', phone: '01722222222', reason: 'পণ্য পছন্দ হয়নি', amount: 360, date: '2025-01-20', status: 'approved', note: '' }
  ];

  function getReturns() { return AdminStore.get('returns', DEFAULT_RETURNS); }
  function saveReturns(l) { AdminStore.set('returns', l); }

  function statusBadge(s) {
    const map = { pending: 'badge-pending', approved: 'badge-confirmed', rejected: 'badge-cancelled', refunded: 'badge-delivered' };
    const labels = { pending: 'অপেক্ষমাণ', approved: 'অনুমোদিত', rejected: 'প্রত্যাখ্যাত', refunded: 'রিফান্ডেড' };
    return `<span class="badge ${map[s] || 'badge-pending'}">${labels[s] || s}</span>`;
  }

  function render() {
    const search = (document.getElementById('searchInput').value || '').toLowerCase();
    const status = document.getElementById('filterStatus').value;
    let list = getReturns();
    if (search) list = list.filter(r => r.orderId.toLowerCase().includes(search) || r.customer.toLowerCase().includes(search));
    if (status) list = list.filter(r => r.status === status);

    document.getElementById('returnBody').innerHTML = list.map(r => `
      <tr>
        <td><strong>${r.id}</strong></td>
        <td>${r.orderId}</td>
        <td>${r.customer}<br><small style="color:var(--gray-500)">${r.phone || ''}</small></td>
        <td>${r.reason}</td>
        <td><strong>${formatTk(r.amount || 0)}</strong></td>
        <td>${formatDate(r.date)}</td>
        <td>${statusBadge(r.status)}</td>
        <td class="actions">
          ${r.status === 'pending' ? `
            <button onclick="setStatus('${r.id}', 'approved')" title="অনুমোদন"><i class="fa-solid fa-check" style="color:var(--green-600)"></i></button>
            <button onclick="setStatus('${r.id}', 'rejected')" title="প্রত্যাখ্যান"><i class="fa-solid fa-xmark" style="color:var(--red-500)"></i></button>
          ` : ''}
          ${r.status === 'approved' ? `<button onclick="setStatus('${r.id}', 'refunded')" title="রিফান্ড দিন"><i class="fa-solid fa-money-bill"></i></button>` : ''}
          <button class="del" onclick="deleteReturn('${r.id}')"><i class="fa-solid fa-trash"></i></button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--gray-500)">কোনো রিটার্ন নেই</td></tr>';
  }

  function openReturnModal() {
    document.getElementById('returnId').value = '';
    document.getElementById('returnOrderId').value = '';
    document.getElementById('returnCustomer').value = '';
    document.getElementById('returnPhone').value = '';
    document.getElementById('returnReason').selectedIndex = 0;
    document.getElementById('returnAmount').value = '';
    document.getElementById('returnNote').value = '';
    document.getElementById('modalTitle').textContent = 'নতুন রিটার্ন';
    document.getElementById('returnModal').classList.add('show');
  }

  function saveReturn() {
    const orderId = document.getElementById('returnOrderId').value.trim();
    const customer = document.getElementById('returnCustomer').value.trim();
    if (!orderId || !customer) { showToast('অর্ডার ID ও কাস্টমার দিন', 'error'); return; }

    const list = getReturns();
    const newId = 'RT' + (1000 + list.length + 1);
    list.unshift({
      id: newId,
      orderId, customer,
      phone: document.getElementById('returnPhone').value.trim(),
      reason: document.getElementById('returnReason').value,
      amount: +document.getElementById('returnAmount').value || 0,
      note: document.getElementById('returnNote').value.trim(),
      date: new Date().toISOString().split('T')[0],
      status: 'pending'
    });
    saveReturns(list);
    closeModal('returnModal');
    render();
    showToast('রিটার্ন যোগ ✅', 'success');
  }

  function setStatus(id, status) {
    const list = getReturns();
    const idx = list.findIndex(r => r.id === id);
    if (idx < 0) return;
    list[idx].status = status;
    saveReturns(list);
    render();
    showToast('স্ট্যাটাস আপডেট ✅', 'success');
  }

  function deleteReturn(id) {
    if (!confirm('ডিলিট?')) return;
    saveReturns(getReturns().filter(r => r.id !== id));
    render();
    showToast('ডিলিট ✅', 'success');
  }

  function closeModal(id) { document.getElementById(id).classList.remove('show'); }

  document.addEventListener('DOMContentLoaded', () => {
    render();
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('filterStatus').addEventListener('change', render);
  });
</script>
</body>
</html>
