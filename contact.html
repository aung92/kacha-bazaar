<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>যোগাযোগ — কাচাবাজার</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 13px; display: block; margin-bottom: 4px; font-weight: 500; }
    .field input, .field textarea { width:100%; padding:11px 12px; border:1px solid var(--gray-200); border-radius:8px; font-family:inherit; outline:none; font-size:14px; }
    .field input:focus, .field textarea:focus { border-color: var(--green-500); }
    .contact-info { background: #fff; padding: 24px; border-radius: 12px; box-shadow: var(--shadow-sm); }
    .contact-info div { margin-bottom: 16px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--gray-700); }
    .contact-info i { color: var(--green-600); font-size: 16px; margin-top: 3px; }
    @media(max-width:768px){ .contact-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div id="site-header"></div>

<div class="container section" style="max-width:900px">
  <h1 style="font-size:28px;margin-bottom:6px">যোগাযোগ করুন</h1>
  <p style="color:var(--gray-500);margin-bottom:24px">যেকোনো প্রশ্ন থাকলে আমাদের লিখুন।</p>

  <div class="contact-grid">
    <form onsubmit="event.preventDefault(); showToast('মেসেজ পাঠানো হয়েছে ✅','success'); this.reset();" style="background:#fff;padding:24px;border-radius:12px;box-shadow:var(--shadow-sm)">
      <div class="field"><label>নাম *</label><input required></div>
      <div class="field"><label>মোবাইল *</label><input required></div>
      <div class="field"><label>ইমেইল</label><input type="email"></div>
      <div class="field"><label>মেসেজ *</label><textarea rows="5" required></textarea></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">পাঠান</button>
    </form>

    <div class="contact-info">
      <h3 style="margin-bottom:18px">📞 সরাসরি যোগাযোগ</h3>
      <div><i class="fa-solid fa-phone"></i><div><strong>মোবাইল</strong><br>০১৭০০-০০০০০০</div></div>
      <div><i class="fa-solid fa-envelope"></i><div><strong>ইমেইল</strong><br>info@kachabazar.com</div></div>
      <div><i class="fa-brands fa-whatsapp"></i><div><strong>WhatsApp</strong><br>+৮৮০ ১৭০০-০০০০০০</div></div>
      <div><i class="fa-solid fa-location-dot"></i><div><strong>ঠিকানা</strong><br>ঢাকা, বাংলাদেশ</div></div>
      <div><i class="fa-solid fa-clock"></i><div><strong>সময়</strong><br>সকাল ৮টা – রাত ৯টা</div></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/pwa-init.js"></script>
</body>
</html>
