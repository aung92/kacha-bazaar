<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সব পণ্য — কাচাবাজার</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .shop-wrap { display: grid; grid-template-columns: 250px 1fr; gap: 24px; padding: 28px 0; }
    .filter-box { background: #fff; border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); position: sticky; top: 90px; height: fit-content; max-height: calc(100vh - 110px); overflow-y: auto; }
    .filter-box h4 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .filter-box label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 4px; cursor: pointer; border-radius: 6px; }
    .filter-box label:hover { background: var(--gray-50); }
    .filter-box input[type=radio] { accent-color: var(--green-600); width: 15px; height: 15px; }
    .filter-box input[type=range] { width: 100%; accent-color: var(--green-600); margin-top: 6px; }
    .filter-divider { margin: 14px 0; border: none; border-top: 1px solid var(--gray-200); }
    .price-display { font-size: 13px; color: var(--gray-500); margin-top: 6px; font-weight: 600; }
    .shop-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .shop-sub { color: var(--gray-500); font-size: 14px; margin-bottom: 18px; }
    .sort-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--gray-200); }
    .sort-bar #resultCount { font-size: 14px; color: var(--gray-500); font-weight: 500; }
    .sort-bar select { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--gray-200); font-size: 14px; font-family: inherit; background: #fff; cursor: pointer; outline: none; }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; }
    .empty-state i { font-size: 56px; color: var(--gray-300); margin-bottom: 16px; }
    .empty-state h3 { font-size: 20px; margin-bottom: 6px; }
    .empty-state p { color: var(--gray-500); margin-bottom: 20px; font-size: 14px; }
    .mobile-filter-btn { display: none; }
    @media (max-width: 900px) {
      .shop-wrap { grid-template-columns: 1fr; }
      .filter-box { position: static; max-height: none; display: none; }
      .filter-box.show { display: block; }
      .mobile-filter-btn { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--gray-200); padding: 9px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; }
    }
  </style>
</head>
<body>

<div id="site-header"></div>

<div class="container">
  <div class="shop-wrap">
    <aside class="filter-box" id="filterBox">
      <h4>ক্যাটাগরি</h4>
      <div id="filterCats"></div>
      <hr class="filter-divider">
      <h4>জেলা</h4>
      <div id="filterDistricts"></div>
      <hr class="filter-divider">
      <h4>সর্বোচ্চ দাম</h4>
      <input type="range" id="priceRange" min="0" max="2000" step="10" value="2000">
      <p class="price-display">৳ <span id="priceVal">2000</span> পর্যন্ত</p>
    </aside>

    <main>
      <h1 class="shop-title" id="shopTitle">সব পণ্য</h1>
      <p class="shop-sub" id="shopSub">লোড হচ্ছে...</p>
      <div class="sort-bar">
        <span id="resultCount"></span>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="mobile-filter-btn" onclick="document.getElementById('filterBox').classList.toggle('show')">
            <i class="fa-solid fa-filter"></i> ফিল্টার
          </button>
          <select id="sortSelect">
            <option value="default">ডিফল্ট</option>
            <option value="low">দাম: কম → বেশি</option>
            <option value="high">দাম: বেশি → কম</option>
            <option value="rating">রেটিং</option>
          </select>
        </div>
      </div>
      <div class="product-grid" id="shopGrid">
        <p style="grid-column:1/-1;text-align:center;color:var(--gray-500);padding:40px">পণ্য লোড হচ্ছে...</p>
      </div>
    </main>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/shop.js"></script>
<script src="js/pwa-init.js"></script>
</body>
</html>
