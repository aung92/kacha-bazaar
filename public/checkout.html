<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>চেকআউট — কাচাবাজার</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--gray-50); }
    .page-header { background: #fff; padding: 20px 0; border-bottom: 1px solid var(--gray-200); margin-bottom: 32px; }
    .page-header h1 { font-size: 24px; font-weight: 700; color: var(--gray-900); }
    .page-header p { color: var(--gray-500); font-size: 14px; margin-top: 4px; }

    .checkout-grid { display: grid; grid-template-columns: 1fr 380px; gap: 30px; align-items: start; padding-bottom: 60px; }

    .form-section { background: #fff; border-radius: 12px; padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; border: 1px solid var(--gray-200); }
    .form-section h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--gray-900); }
    .form-section h2 i { color: var(--green-600); }
    
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-row.single { grid-template-columns: 1fr; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--gray-700); }
    .field input, .field select, .field textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--gray-300); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green-500); }

    .payment-options { display: flex; flex-direction: column; gap: 12px; }
    .pay-card { display: flex; gap: 12px; align-items: center; padding: 16px; border: 1px solid var(--gray-200); border-radius: 8px; cursor: pointer; transition: all 0.2s; background: #fff; }
    .pay-card:hover { border-color: var(--green-500); background: var(--green-50); }
    .pay-card input[type="radio"] { width: 18px; height: 18px; accent-color: var(--green-600); cursor: pointer; }
    .pay-card-text { flex: 1; }
    .pay-card-text strong { display: block; font-size: 15px; color: var(--gray-900); }
    .pay-card-text small { color: var(--gray-500); font-size: 12px; }
    .pay-icon { font-size: 24px; width: 32px; text-align: center; }

    .summary-box { background: #fff; border-radius: 12px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200); position: sticky; top: 100px; }
    .summary-box h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; border-bottom: 1px solid var(--gray-200); padding-bottom: 12px; }
    .co-items { margin-bottom: 20px; max-height: 350px; overflow-y: auto; padding-right: 4px; }
    .co-items::-webkit-scrollbar { width: 4px; }
    .co-items::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 4px; }
    .co-item { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
    .co-item img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; border: 1px solid var(--gray-200); flex-shrink: 0; }
    .co-item-info { flex: 1; min-width: 0; }
    .co-item-info strong { font-size: 14px; display: block; color: var(--gray-900); line-height: 1.3; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .co-item-info small { font-size: 12px; color: var(--gray-500); }
    .co-item-total { font-size: 14px; font-weight: 600; color: var(--gray-700); white-space: nowrap; }

    .summary-line { display: flex; justify-content: space-between; padding: 10px 0; font-size: 14px; color: var(--gray-700); }
    .summary-line.total { border-top: 1px solid var(--gray-200); margin-top: 10px; padding-top: 14px; font-size: 20px; font-weight: 700; color: var(--green-700); }
    .secure-badge { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; font-size: 12px; color: var(--gray-500); }

    @media(max-width: 900px) {
      .checkout-grid { grid-template-columns: 1fr; gap: 20px; }
      .summary-box { position: static; order: -1; }
    }
    @media(max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="site-header"></div>

<div class="page-header">
  <div class="container">
    <h1>চেকআউট</h1>
    <p>অর্ডার কনফার্ম করতে নিচের তথ্যগুলো পূরণ করুন</p>
  </div>
</div>

<div class="container">
  <div class="checkout-grid">
    
    <div class="checkout-form-area">
      <form id="checkoutForm">
        
        <div class="form-section">
          <h2><i class="fa-solid fa-user"></i> ডেলিভারি তথ্য</h2>
          <div class="form-row">
            <div class="field">
              <label>পূর্ণ নাম *</label>
              <input type="text" name="name" required placeholder="যেমন: রফিক আহমেদ">
            </div>
            <div class="field">
              <label>মোবাইল নম্বর *</label>
              <input type="tel" name="phone" required pattern="01[0-9]{9}" placeholder="017XXXXXXXX">
            </div>
          </div>
          <div class="form-row single">
            <div class="field">
              <label>সম্পূর্ণ ঠিকানা *</label>
              <textarea name="address" required rows="2" placeholder="বাসা/রোড/এলাকা বিস্তারিত লিখুন..."></textarea>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label>এলাকা / শহর *</label>
              <select name="area" required>
                <option value="">এলাকা নির্বাচন করুন</option>
                <option>ঢাকা — মিরপুর</option>
                <option>ঢাকা — উত্তরা</option>
                <option>ঢাকা — ধানমন্ডি</option>
                <option>চট্টগ্রাম</option>
                <option>সিলেট</option>
              </select>
            </div>
            <div class="field">
              <label>ডেলিভারি স্লট</label>
              <select name="slot">
                <option>আজ বিকাল (৩-৬টা)</option>
                <option>আজ সন্ধ্যা (৬-৯টা)</option>
                <option>কাল সকাল (৮-১১টা)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- ✅ ডাইনামিক পেমেন্ট অপশন -->
        <div class="form-section">
          <h2><i class="fa-solid fa-wallet"></i> পেমেন্ট পদ্ধতি</h2>
          <div class="payment-options" id="paymentOptionsContainer">
            <!-- জাভাস্ক্রিপ্ট দিয়ে লোড হবে -->
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; justify-content:center; padding: 16px; font-size: 16px; border-radius: 8px; background: var(--green-600); color: #fff; border: none; cursor: pointer; font-weight: 600;">
          <i class="fa-solid fa-check-circle"></i> অর্ডার কনফার্ম করুন
        </button>
      </form>
    </div>

    <div class="summary-box">
      <h2>আপনার অর্ডার</h2>
      <div class="co-items" id="checkoutItems"></div>
      <div class="summary-line">
        <span>সাবটোটাল</span>
        <span id="coSubtotal">৳০</span>
      </div>
      <div class="summary-line">
        <span>ডেলিভারি চার্জ</span>
        <span id="coDelivery">৳০</span>
      </div>
      <div class="summary-line total">
        <span>সর্বমোট</span>
        <span id="coTotal">৳০</span>
      </div>
      <div class="secure-badge">
        <i class="fa-solid fa-lock" style="color:var(--green-500)"></i> নিরাপদ ও সুরক্ষিত চেকআউট
      </div>
    </div>

  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
  let detailed = [];
  let subtotal = 0, delivery = 0, total = 0;

  document.addEventListener('DOMContentLoaded', async () => {
    const items = Cart.get();
    if (!items.length) {
      showToast('আপনার কার্ট খালি, দয়া করে পণ্য যোগ করুন', 'error');
      setTimeout(() => location.href = 'cart.html', 1200);
      return;
    }

    try {
      const allProducts = await loadProducts();
      detailed = items.map(i => {
        const p = allProducts.find(x => Number(x.id) === Number(i.id));
        return p ? { ...p, qty: i.qty } : null;
      }).filter(Boolean);
    } catch (err) {
      console.error('Product load failed:', err);
    }

    document.getElementById('checkoutItems').innerHTML = detailed.map(p => `
      <div class="co-item">
        <img src="${p.img}" alt="${p.name}">
        <div class="co-item-info">
          <strong>${p.name}</strong>
          <small>${p.qty} × ${formatTk(p.price)} (${p.unit})</small>
        </div>
        <div class="co-item-total">${formatTk(p.price * p.qty)}</div>
      </div>
    `).join('');

    subtotal = detailed.reduce((s, i) => s + i.price * i.qty, 0);
    delivery = subtotal > 500 ? 0 : 40;
    total = subtotal + delivery;

    document.getElementById('coSubtotal').textContent = formatTk(subtotal);
    document.getElementById('coDelivery').textContent = delivery === 0 ? 'ফ্রি' : formatTk(delivery);
    document.getElementById('coTotal').textContent = formatTk(total);

    // ✅ ৩. অ্যাডমিন সেটিংস থেকে পেমেন্ট অপশন লোড
    loadPaymentMethods();

    // ✅ ৪. ইউজার ডেটা থাকলে অটো ফিল
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
        const form = document.getElementById('checkoutForm');
        if (profile?.name) form.name.value = profile.name;
        if (profile?.phone) form.phone.value = profile.phone;
      }
    } catch (e) { console.warn('Prefill skipped'); }
  });

  // ✅ অ্যাডমিন সেটিংস থেকে ডাইনামিক পেমেন্ট অপশন তৈরি (Fixed)
  function loadPaymentMethods() {
    let settings = {};
    try {
      // সরাসরি অ্যাডমিন সেটিংসের লোকাল স্টোরেজ থেকে ডাটা পড়া
      const raw = localStorage.getItem('kc_admin_settings');
      if (raw) settings = JSON.parse(raw);
    } catch (e) {
      console.warn("Could not parse admin settings", e);
    }

    const container = document.getElementById('paymentOptionsContainer');
    let availableMethods = [];

    // অ্যাডমিন প্যানেলের ডাটা চেক (ডিফল্ট true ধরা হয়েছে, যদি সেটিংসে false থাকে তবে বন্ধ হবে)
    if (settings.payCod !== false) {
      availableMethods.push({ value: 'cod', icon: '💵', name: 'ক্যাশ অন ডেলিভারি (COD)', desc: 'পণ্য হাতে পেয়ে টাকা পরিশোধ করুন' });
    }
    if (settings.payBkash !== false) {
      availableMethods.push({ value: 'bkash', icon: '📱', name: 'বিকাশ (bKash)', desc: 'ম্যানুয়াল পেমেন্ট (সেন্ড মানি)' });
    }
    if (settings.payNagad !== false) {
      availableMethods.push({ value: 'nagad', icon: '📲', name: 'নগদ (Nagad)', desc: 'ম্যানুয়াল পেমেন্ট (সেন্ড মানি)' });
    }
    if (settings.aamarpayEnabled === true) {
      availableMethods.push({ value: 'aamarpay', icon: '💳', name: 'অনলাইন পেমেন্ট (aamarPay)', desc: 'কার্ড, বিকাশ, নগদ সব এক জায়গায়' });
    }

    // যদি কোনো মেথডই চালু না থাকে, তবে ডিফল্টভাবে COD দেখাবে
    if (availableMethods.length === 0) {
      availableMethods.push({ value: 'cod', icon: '💵', name: 'ক্যাশ অন ডেলিভারি (COD)', desc: 'পণ্য হাতে পেয়ে টাকা পরিশোধ করুন' });
    }

    // HTML তৈরি
    container.innerHTML = availableMethods.map((m, index) => `
      <label class="pay-card">
        <input type="radio" name="pay" value="${m.value}" ${index === 0 ? 'checked' : ''}>
        <div class="pay-icon">${m.icon}</div>
        <div class="pay-card-text">
          <strong>${m.name}</strong>
          <small>${m.desc}</small>
        </div>
      </label>
    `).join('');
  }

  // ✅ সাবমিট ফাংশন
  document.getElementById('checkoutForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const originalHTML = btn.innerHTML;
    
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> অর্ডার প্রসেস হচ্ছে...';
    btn.disabled = true;

    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        showToast('অর্ডার করতে লগইন করুন', 'error');
        setTimeout(() => location.href = 'login.html?redirect=checkout.html', 1200);
        return;
      }

      const formData = new FormData(e.target);
      const orderId = 'KC-' + Date.now();
      const paymentMethod = formData.get('pay');

      // ১. Supabase-এ অর্ডার সেভ
      const { data: orderData, error: orderError } = await supabaseClient
        .from('orders')
        .insert({
          order_number: orderId,
          customer_id: session.user.id,
          customer_name: formData.get('name'),
          customer_phone: formData.get('phone'),
          customer_address: formData.get('address'),
          area: formData.get('area'),
          delivery_slot: formData.get('slot'),
          subtotal: subtotal,
          delivery: delivery,
          total: total,
          payment_method: paymentMethod,
          payment_status: 'unpaid',
          status: 'pending'
        })
        .select()
        .single();

      if (orderError) throw orderError;

      // ২. অর্ডারের পণ্যগুলো সেভ
      const orderItems = detailed.map(p => ({
        order_id: orderData.id,
        name: p.name,
        price: p.price,
        qty: p.qty,
        unit: p.unit,
        subtotal: p.price * p.qty
      }));

      const { error: itemsError } = await supabaseClient.from('order_items').insert(orderItems);
      if (itemsError) throw itemsError;

      // ৩. পেমেন্ট অনুযায়ী অ্যাকশন
      Cart.clear();
      
      if (paymentMethod === 'aamarpay') {
        try {
          const res = await fetch('/api/payment/initiate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              orderId: orderId,
              amount: total,
              customerName: formData.get('name'),
              customerPhone: formData.get('phone'),
              customerEmail: 'customer@example.com'
            })
          });
          
          const text = await res.text();
          let data;
          try { data = JSON.parse(text); } catch { throw new Error("সার্ভার থেকে সঠিক রেসপন্স আসেনি"); }

          if (data.success && data.payment_url) {
            window.location.href = data.payment_url;
          } else {
            throw new Error(data.message || "পেমেন্ট লিংক পাওয়া যায়নি");
          }
        } catch (err) {
          showToast('পেমেন্ট গেটওয়ে এরর: ' + err.message, 'error');
          setTimeout(() => { window.location.href = 'account.html?order_success=true'; }, 2500);
        }
      } else {
        showToast('অর্ডার সফলভাবে সম্পন্ন হয়েছে ✅', 'success');
        setTimeout(() => {
          window.location.href = 'account.html?order_success=true';
        }, 1500);
      }

    } catch (err) {
      console.error('Order error:', err);
      showToast('অর্ডার ব্যর্থ: ' + err.message, 'error');
      btn.innerHTML = originalHTML;
      btn.disabled = false;
    }
  };
</script>
<script src="js/pwa-init.js"></script>
</body>
</html>
