<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন — কাচাবাজার</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { 
      --green: #16a34a; --green-dark: #15803d; --gray-100: #f3f4f6; 
      --gray-200: #e5e7eb; --gray-500: #6b7280; --gray-900: #111827; --red: #dc2626; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
    body { background: linear-gradient(135deg, #f0fdf4, #ffffff); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { background: #fff; width: 100%; max-width: 420px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--gray-200); }
    .brand { text-align: center; font-size: 28px; font-weight: 700; color: var(--green-dark); margin-bottom: 5px; }
    .brand span { color: #ff6b35; }
    .subtitle { text-align: center; color: var(--gray-500); font-size: 14px; margin-bottom: 24px; }
    
    .tabs { display: flex; background: var(--gray-100); padding: 5px; border-radius: 10px; margin-bottom: 20px; }
    .tabs button { flex: 1; padding: 10px; border: none; background: transparent; font-weight: 600; color: var(--gray-500); border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 14px; }
    .tabs button.active { background: #fff; color: var(--green-dark); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    .form-section { display: none; }
    .form-section.active { display: block; }
    
    .form-group { margin-bottom: 15px; position: relative; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-900); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--gray-200); border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--green); }
    
    .btn-submit { width: 100%; padding: 12px; background: var(--green); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: var(--green-dark); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
    
    .alert { padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; text-align: center; display: none; }
    .alert-error { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: var(--green-dark); border: 1px solid #bbf7d0; }
    
    .link-text { text-align: center; display: block; margin-top: 15px; font-size: 13px; color: var(--gray-500); cursor: pointer; text-decoration: none; }
    .link-text:hover { color: var(--green-dark); text-decoration: underline; }
    
    .toggle-password { position: absolute; right: 14px; top: 38px; color: var(--gray-500); cursor: pointer; }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="brand">কাচা<span>বাজার</span></div>
  <div class="subtitle" id="pageSubtitle">আপনার অ্যাকাউন্টে প্রবেশ করুন</div>

  <div id="alertBox" class="alert"></div>

  <div class="tabs" id="authTabs">
    <button type="button" id="tabLogin" class="active">লগইন</button>
    <button type="button" id="tabRegister">নতুন অ্যাকাউন্ট</button>
  </div>

  <!-- Login Form -->
  <form id="loginForm" class="form-section active">
    <div class="form-group">
      <label>মোবাইল নম্বর</label>
      <input type="tel" id="loginPhone" required placeholder="017XXXXXXXX">
    </div>
    <div class="form-group">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="loginPassword" required placeholder="••••••••">
      <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('loginPassword')"></i>
    </div>
    <button type="submit" class="btn-submit" id="btnLogin">লগইন করুন</button>
    <a class="link-text" id="linkForgot">পাসওয়ার্ড ভুলে গেছেন?</a>
  </form>

  <!-- Register Form -->
  <form id="registerForm" class="form-section">
    <div class="form-group">
      <label>নাম</label>
      <input type="text" id="regName" required placeholder="আপনার নাম">
    </div>
    <div class="form-group">
      <label>মোবাইল নম্বর</label>
      <input type="tel" id="regPhone" required placeholder="017XXXXXXXX">
    </div>
    <div class="form-group">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="regPassword" required placeholder="কমপক্ষে ৬ অক্ষর">
      <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('regPassword')"></i>
    </div>
    <button type="submit" class="btn-submit" id="btnRegister">রেজিস্ট্রেশন করুন</button>
  </form>

  <!-- Forgot Password Form -->
  <form id="forgotForm" class="form-section">
    <p style="font-size: 13px; color: var(--gray-500); margin-bottom: 15px; text-align: center;">
      আপনার মোবাইল নম্বর দিন। (বিঃদ্রঃ ডেমো সিস্টেমে পাসওয়ার্ড রিসেটের জন্য নিচের ইমেইলটি ব্যবহৃত হবে)
    </p>
    <div class="form-group">
      <label>মোবাইল নম্বর</label>
      <input type="tel" id="forgotPhone" required placeholder="017XXXXXXXX">
    </div>
    <button type="submit" class="btn-submit" id="btnForgot">রিসেট করুন</button>
    <a class="link-text" id="linkBackToLogin"><i class="fa-solid fa-arrow-left"></i> লগইনে ফিরে যান</a>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    
    const SUPABASE_URL = 'https://ddjtvleuntyjuasawoyj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_37VvUbK_5T79ddNbAgzykg_gDUVpKKV';
    
    if (typeof window.supabase === 'undefined') {
      console.error('Supabase SDK লোড হয়নি!');
      return;
    }
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ✅ মোবাইল নাম্বার থেকে ফেইক ইমেইল জেনারেট করার ফাংশন
    function getFakeEmail(phone) {
      // স্পেস বা ড্যাশ থাকলে রিমুভ করে শুধু নাম্বার নেওয়া
      const cleanPhone = phone.replace(/\D/g, ''); 
      return `${cleanPhone}@kachabazar.com`;
    }

    const alertBox = document.getElementById('alertBox');
    const pageSubtitle = document.getElementById('pageSubtitle');
    const authTabs = document.getElementById('authTabs');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const formLogin = document.getElementById('loginForm');
    const formRegister = document.getElementById('registerForm');
    const formForgot = document.getElementById('forgotForm');

    function showSection(section) {
      [formLogin, formRegister, formForgot].forEach(f => f.classList.remove('active'));
      tabLogin.classList.remove('active');
      tabRegister.classList.remove('active');
      alertBox.style.display = 'none';

      if (section === 'login') {
        formLogin.classList.add('active');
        tabLogin.classList.add('active');
        authTabs.style.display = 'flex';
        pageSubtitle.textContent = 'আপনার অ্যাকাউন্টে প্রবেশ করুন';
      } else if (section === 'register') {
        formRegister.classList.add('active');
        tabRegister.classList.add('active');
        authTabs.style.display = 'flex';
        pageSubtitle.textContent = 'নতুন অ্যাকাউন্ট তৈরি করুন';
      } else if (section === 'forgot') {
        formForgot.classList.add('active');
        authTabs.style.display = 'none';
        pageSubtitle.textContent = 'পাসওয়ার্ড রিসেট করুন';
      }
    }

    tabLogin.addEventListener('click', () => showSection('login'));
    tabRegister.addEventListener('click', () => showSection('register'));
    document.getElementById('linkForgot').addEventListener('click', () => showSection('forgot'));
    document.getElementById('linkBackToLogin').addEventListener('click', () => showSection('login'));

    window.togglePassword = function(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    };

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = 'block';
    }

    // Auto-Redirect
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'index.html'; 
    });

    // ============================================
    // ১. Login Form Submit (মোবাইল দিয়ে)
    // ============================================
    formLogin.onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const phone = document.getElementById('loginPhone').value;
      const password = document.getElementById('loginPassword').value;

      if(!phone || !password) return showAlert('মোবাইল এবং পাসওয়ার্ড দিন!');

      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> লগইন হচ্ছে...';
      btn.disabled = true;

      // মোবাইল থেকে ফেইক ইমেইল তৈরি
      const email = getFakeEmail(phone);

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = 'index.html'; 
      } catch (err) {
        showAlert(err.message === 'Invalid login credentials' ? 'ভুল মোবাইল নম্বর বা পাসওয়ার্ড!' : err.message);
        btn.innerHTML = 'লগইন করুন';
        btn.disabled = false;
      }
    };

    // ============================================
    // ২. Register Form Submit (মোবাইল দিয়ে)
    // ============================================
    formRegister.onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnRegister');
      const name = document.getElementById('regName').value;
      const phone = document.getElementById('regPhone').value;
      const password = document.getElementById('regPassword').value;

      if(!phone || !password || !name) return showAlert('সব ঘর পূরণ করুন!');

      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> তৈরি হচ্ছে...';
      btn.disabled = true;

      // মোবাইল থেকে ফেইক ইমেইল তৈরি
      const email = getFakeEmail(phone);

      try {
        const { data, error } = await supabase.auth.signUp({
          email, 
          password,
          options: { data: { name: name, phone: phone, role: 'customer' } }
        });
        
        if (error) throw error;

        showAlert('রেজিস্ট্রেশন সফল হয়েছে! এখন লগইন করুন।', 'success');
        showSection('login');
        formRegister.reset();
        
        // অটো-ফিল মোবাইল নাম্বার লগইন ফর্মে
        document.getElementById('loginPhone').value = phone;
      } catch (err) {
        showAlert(err.message);
      } finally {
        btn.innerHTML = 'রেজিস্ট্রেশন করুন';
        btn.disabled = false;
      }
    };

    // ============================================
    // ৩. Forgot Password (ডেমো সিস্টেম)
    // ============================================
    formForgot.onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnForgot');
      const phone = document.getElementById('forgotPhone').value;

      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> প্রসেস হচ্ছে...';
      btn.disabled = true;

      const email = getFakeEmail(phone);

      try {
        const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/reset-password.html',
        });
        if (error) throw error;

        // যেহেতু এটি ফেইক ইমেইল, তাই আমরা একটি অ্যালার্ট দেখাবো
        showAlert(`পাসওয়ার্ড রিসেট লিংকটি ইন্টারনাল ইমেইলে পাঠানো হয়েছে। (${email})`, 'success');
        formForgot.reset();
      } catch (err) {
        showAlert(err.message);
      } finally {
        btn.innerHTML = 'রিসেট করুন';
        btn.disabled = false;
      }
    };

  }); 
</script>
<script src="js/pwa-init.js"></script>
</body>
</html>
