<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পেজ পাওয়া যায়নি — কাচাবাজার</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: linear-gradient(135deg, #f0fdf4, #fff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      text-align: center;
      color: #111827;
    }
    .box { max-width: 420px; padding: 20px; }
    h1 { font-size: 80px; color: #16a34a; margin: 0; }
    h2 { font-size: 24px; margin: 8px 0; }
    p { color: #6b7280; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #16a34a;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>পেজ পাওয়া যায়নি</h2>
    <p>আপনি যে পেজটি খুঁজছেন সেটি সরানো হয়েছে বা নেই।</p>
    <a href="/">হোমে ফিরে যান</a>
  </div>
  <script src="/js/pwa-init.js"></script>
</body>
</html>
