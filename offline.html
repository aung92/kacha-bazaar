<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অফলাইন — কাচাবাজার</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: linear-gradient(135deg, #f0fdf4, #fff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
      color: #111827;
    }
    .offline-box {
      text-align: center;
      max-width: 400px;
      background: #fff;
      padding: 40px 28px;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.1);
    }
    .offline-icon {
      width: 100px;
      height: 100px;
      background: #f0fdf4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 44px;
      color: #16a34a;
    }
    .offline-box h1 {
      font-size: 24px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .offline-box p {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #16a34a;
      color: #fff;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .retry-btn:hover {
      background: #15803d;
      transform: translateY(-2px);
    }
    .retry-btn i { font-size: 16px; }
    .status-indicator {
      margin-top: 24px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
      font-size: 13px;
      color: #6b7280;
    }
    .status-indicator.online {
      background: #f0fdf4;
      color: #15803d;
    }
  </style>
</head>
<body>
  <div class="offline-box">
    <div class="offline-icon">
      <i class="fa-solid fa-wifi"></i>
    </div>
    <h1>আপনি অফলাইনে আছেন</h1>
    <p>ইন্টারনেট সংযোগ নেই। অনুগ্রহ করে সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।</p>
    <button class="retry-btn" onclick="location.reload()">
      <i class="fa-solid fa-rotate-right"></i> আবার চেষ্টা করুন
    </button>
    <div class="status-indicator" id="statusIndicator">
      <i class="fa-solid fa-circle" style="color:#ef4444; font-size:8px; margin-right:6px;"></i>
      <span>অফলাইন</span>
    </div>
  </div>

  <script>
    // অনলাইন হলে রিলোড
    window.addEventListener('online', () => {
      const el = document.getElementById('statusIndicator');
      el.classList.add('online');
      el.innerHTML = '<i class="fa-solid fa-circle" style="color:#16a34a; font-size:8px; margin-right:6px;"></i><span>অনলাইন! রিলোড হচ্ছে...</span>';
      setTimeout(() => location.reload(), 800);
    });

    // অটো চেক প্রতি ৩ সেকেন্ডে
    setInterval(() => {
      if (navigator.onLine) location.reload();
    }, 3000);
  </script>
</body>
</html>
